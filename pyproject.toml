[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Modular evaluation harness for RAG pipelines: RAGAS metrics, LLM-as-judge diagnostics, custom hallucination detection, and CI regression gating."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ragas>=0.2.0",
    "openai>=1.40.0",
    "groq>=0.11.0",
    "instructor>=1.4.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "vcrpy>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
evalharness = "eval_harness.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eval_harness*", "rag_demo*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
