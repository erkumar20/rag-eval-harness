name: RAG eval gate

# Blocks a PR when the demo pipeline's metric scores regress beyond the allowed threshold
# (BASELINE_DROP_THRESHOLD, default 5%) versus the committed baseline.json.
#
# This costs real API spend and ~14 minutes per run, so the expensive steps only run for PRs
# that touch the pipeline, harness or baseline (decided by .github/scripts/eval_scope.sh).
#
# It triggers on EVERY pull request, deliberately: this job is meant to be a required status
# check, and a required check that never triggers sits pending forever, which would make
# docs-only PRs unmergeable. When nothing relevant changed, the evaluation steps are skipped
# and the job still reports success within seconds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A second push to the same PR makes the in-flight run's result obsolete -- cancel it
  # rather than paying for two full evaluations.
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    # A clean run is ~15 min, but a *failing* run is slower: low scores push more metrics
    # under the judge threshold, so the judge fires more, and heavier token use draws more
    # rate-limit backoff from both providers. A first validation run hit a 45-minute cap
    # mid-evaluation and was cancelled, which wasted the spend and produced no verdict.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rag_eval
      QDRANT_LOCAL_PATH: ./qdrant_data
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scope check can diff against the PR's base commit.
          fetch-depth: 0

      - name: Decide whether the evaluation applies
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/eval_scope.sh

      # The gate grades a PR against the baseline on the BASE branch, never the PR's own copy.
      # Otherwise a PR could lower baseline.json and then pass against its own weakened bar.
      # Fails closed: no baseline on the base branch is an error, not a free pass.
      - name: Pin the baseline to the base branch
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git show "$BASE_SHA:baseline.json" > "$RUNNER_TEMP/baseline.base.json"; then
              echo "::error::baseline.json does not exist on the base branch, so there is nothing to grade this PR against."
              exit 1
            fi
            echo "path=$RUNNER_TEMP/baseline.base.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=baseline.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Report baseline.json changes
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/baseline_changes.py "${{ steps.baseline.outputs.path }}" baseline.json baseline-change.md

      - name: Note that the evaluation was skipped
        if: steps.scope.outputs.run != 'true'
        run: |
          {
            echo "## RAG eval gate"
            echo
            echo "Skipped: ${{ steps.scope.outputs.reason }}. No regression is possible from this change, so no evaluation was run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.13'
          cache: pip

      - name: Install package
        if: steps.scope.outputs.run == 'true'
        run: pip install -e ".[dev]"

      # The demo pipeline embeds locally with bge-small-en-v1.5 (~130MB). Caching it keeps
      # every run from re-downloading it from the HF hub.
      - name: Cache embedding model
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Apply database migrations
        if: steps.scope.outputs.run == 'true'
        run: alembic upgrade head

      # Qdrant runs in embedded local mode (a directory, no server), so the collection has to
      # be built from the committed corpus on each fresh runner.
      - name: Ingest corpus into Qdrant
        if: steps.scope.outputs.run == 'true'
        run: python -m rag_demo.ingest

      # --no-use-judge: the gate's verdict is computed purely from metric scores, so the
      # judge contributes nothing to pass/fail here -- it only writes prose. Leaving it on
      # made CI dramatically slower on exactly the runs that matter, because a failing run
      # pushes more metrics under the judge threshold and therefore fires *more* GPT-4o
      # calls the worse the regression is. Two validation runs were cancelled at the timeout
      # before this was cut. Judge diagnostics stay available for local/manual runs.
      - name: Run evaluation and gate against baseline
        id: gate
        if: steps.scope.outputs.run == 'true'
        env:
          BASELINE_FILE: ${{ steps.baseline.outputs.path }}
        run: |
          evalharness run \
            --pipeline demo \
            --pipeline-version "${{ github.sha }}" \
            --no-use-judge \
            --gate \
            --baseline-file "$BASELINE_FILE" \
            --summary-file gate-summary.md

      # Runs even when the gate step failed -- a blocked PR is exactly when the reader most
      # needs to see which metric moved and by how much.
      - name: Publish summary
        if: always() && steps.scope.outputs.run == 'true'
        # The summary is only written once the evaluation reaches the gating step, so a run
        # that is cancelled or crashes mid-evaluation (rate limit, timeout) has none. Without
        # this guard `cat` fails and stacks a second, misleading error on top of the real one.
        run: |
          if [ -f gate-summary.md ]; then
            cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gate summary was produced: the evaluation did not reach the gating step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish baseline changes
        if: always() && hashFiles('baseline-change.md') != ''
        run: cat baseline-change.md >> "$GITHUB_STEP_SUMMARY"

      # Posts whatever there is to say: the metric deltas, a baseline.json change, or both.
      # A baseline-only PR skips the evaluation but still gets its baseline change flagged.
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            if (fs.existsSync('gate-summary.md')) {
              parts.push(fs.readFileSync('gate-summary.md', 'utf8'));
              parts.push("_Graded against `baseline.json` on the base branch, not this PR's copy._\n");
            }
            if (fs.existsSync('baseline-change.md')) {
              parts.push(fs.readFileSync('baseline-change.md', 'utf8'));
            }
            if (parts.length === 0) {
              core.info('Nothing to report: no gate summary and no baseline change.');
              return;
            }
            const marker = '<!-- rag-eval-gate -->';
            const body = marker + '\n' + parts.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
